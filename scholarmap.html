<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NZ Scholarship Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0f1923;--surface:#162030;--surface2:#1d2a3a;--border:#2a3a4a;--text:#e8f0f8;--muted:#7a9ab5;--accent:#f5c842;--school:#4dd08a;--university:#5aabff;--company:#ff8c5a;--org:#c97fff;--danger:#ff5f5f;--r:10px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:1000;}
    .logo{display:flex;align-items:center;gap:9px;}
    .logo-icon{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;}
    .logo h1{font-family:'Playfair Display',serif;font-size:1.25rem;}
    .logo span{color:var(--accent);}
    .legend{display:flex;gap:14px;flex-wrap:wrap;}
    .li{display:flex;align-items:center;gap:5px;font-size:0.76rem;color:var(--muted);}
    .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
    .hint{font-size:0.76rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:5px 12px;border-radius:20px;}
    .main{display:flex;flex:1;overflow:hidden;}
    .sidebar{width:360px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
    .sb-top{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .sb-top h2{font-size:0.8rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
    .total-badge{background:var(--accent);color:#000;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:20px;}
    .search-wrap{padding:8px 12px;border-bottom:1px solid var(--border);}
    .search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.84rem;padding:7px 11px;outline:none;transition:border-color .15s;}
    .search-wrap input:focus{border-color:var(--accent);}
    .search-wrap input::placeholder{color:var(--muted);}
    .filters-panel{border-bottom:1px solid var(--border);flex-shrink:0;}
    .filters-toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;user-select:none;transition:background .15s;}
    .filters-toggle:hover{background:var(--surface2);}
    .ftog-left{display:flex;align-items:center;gap:8px;font-size:0.82rem;font-weight:600;}
    .ftog-right{display:flex;align-items:center;gap:8px;}
    .active-pill{background:var(--accent);color:#000;font-size:0.68rem;font-weight:700;padding:2px 7px;border-radius:20px;display:none;}
    .active-pill.show{display:inline-block;}
    .fchev{font-size:0.68rem;color:var(--muted);transition:transform .2s;display:inline-block;}
    .fchev.open{transform:rotate(90deg);}
    .filters-body{overflow:hidden;max-height:0;transition:max-height .3s ease;}
    .filters-body.open{max-height:1400px;}
    .filters-inner{padding:10px 12px 12px;}
    .fgroup{margin-bottom:11px;}
    .fgroup:last-child{margin-bottom:0;}
    .fglabel{font-size:0.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px;}
    .chips{display:flex;flex-wrap:wrap;gap:4px;}
    .chip{padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;}
    .chip:hover{color:var(--text);border-color:var(--muted);}
    .chip.on{color:#000!important;border-color:transparent;}
    .chip.on.c-school{background:var(--school);}
    .chip.on.c-university{background:var(--university);}
    .chip.on.c-company{background:var(--company);}
    .chip.on.c-org{background:var(--org);}
    .chip.on.c-undergrad{background:#5aabff;}
    .chip.on.c-postgrad{background:#ff8c5a;}
    .chip.on.c-phd{background:#ff6b9d;}
    .chip.on.c-trades{background:#ffe066;}
    .chip.on.c-intl{background:#e272ff;}
    .chip.on.c-domestic{background:#4de8c0;}
    .chip.on.c-maori{background:#ff6b6b;}
    .chip.on.c-pasifika{background:#ffa94d;}
    .chip.on.c-asian{background:#74c0fc;}
    .chip.on.c-open{background:#aaa;}
    .chip.on.c-women{background:#f783ac;}
    .chip.on.c-open-gender{background:#aaa;}
    .chip.on.c-stem{background:#69db7c;}
    .chip.on.c-health{background:#38d9a9;}
    .chip.on.c-business{background:#fcc419;}
    .chip.on.c-law{background:#a9e34b;}
    .chip.on.c-arts{background:#da77f2;}
    .chip.on.c-education{background:#4dabf7;}
    .chip.on.c-environment{background:#63e6be;}
    .chip.on.c-trades-field{background:#ffd43b;}
    .chip.on.c-any{background:#bbb;}
    .chip.on.c-full{background:#51cf66;}
    .chip.on.c-partial{background:#94d82d;}
    .chip.on.c-north{background:#a3e05a;}
    .chip.on.c-south{background:#5ae0d0;}
    .filter-footer{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--border);}
    .vis-count{font-size:0.72rem;color:var(--muted);}
    .vis-count span{color:var(--accent);font-weight:600;}
    .clear-btn{font-size:0.72rem;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:underline;padding:0;transition:color .15s;}
    .clear-btn:hover{color:var(--accent);}
    .sections-scroll{flex:1;overflow-y:auto;}
    .sections-scroll::-webkit-scrollbar{width:4px;}
    .sections-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .sec-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;user-select:none;}
    .sec-head:hover{background:var(--surface2);}
    .sec-left{display:flex;align-items:center;gap:9px;}
    .sec-name{font-size:0.86rem;font-weight:600;}
    .sec-cnt{font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:20px;color:#000;}
    .sec-cnt.school{background:var(--school);}
    .sec-cnt.university{background:var(--university);}
    .sec-cnt.company{background:var(--company);}
    .sec-cnt.org{background:var(--org);}
    .sec-chev{font-size:0.68rem;color:var(--muted);transition:transform .2s;display:inline-block;}
    .sec-chev.open{transform:rotate(90deg);}
    .sec-body{overflow:hidden;max-height:0;transition:max-height .35s ease;}
    .sec-body.open{max-height:3000px;}
    .cards-wrap{padding:6px 10px 8px;overflow-y:auto;max-height:320px;}
    .cards-wrap::-webkit-scrollbar{width:4px;}
    .cards-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;margin-bottom:6px;cursor:pointer;transition:all .16s;position:relative;overflow:hidden;}
    .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
    .card.school::before{background:var(--school);}
    .card.university::before{background:var(--university);}
    .card.company::before{background:var(--company);}
    .card.org::before{background:var(--org);}
    .card:hover{border-color:var(--accent);transform:translateX(2px);}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:5px;margin-bottom:2px;}
    .card-name{font-weight:600;font-size:0.84rem;line-height:1.3;}
    .card-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.82rem;padding:0;line-height:1;flex-shrink:0;transition:color .15s;}
    .card-del:hover{color:var(--danger);}
    .card-schname{font-size:0.78rem;color:var(--text);margin-bottom:2px;}
    .card-amount{font-size:0.88rem;font-weight:700;color:var(--accent);margin-bottom:3px;}
    .card-desc{font-size:0.72rem;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-loc{font-size:0.68rem;color:var(--muted);margin-top:4px;}
    .card-link{font-size:0.7rem;color:var(--accent);text-decoration:none;display:inline-block;margin-top:3px;}
    .card-link:hover{text-decoration:underline;}
    .tags{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0;}
    .tag{display:inline-block;font-size:0.6rem;font-weight:600;padding:1px 5px;border-radius:8px;}
    .no-results{text-align:center;padding:14px 0;font-size:0.76rem;color:var(--muted);}
    .add-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:7px;border-radius:8px;background:transparent;border:1px dashed var(--border);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.78rem;cursor:pointer;transition:all .15s;margin-top:2px;}
    .add-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(245,200,66,0.05);}
    #map{flex:1;cursor:crosshair;}
    .leaflet-pane{z-index:1;}
    .leaflet-top,.leaflet-bottom{z-index:100;}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s;}
    .overlay.open{opacity:1;pointer-events:all;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;padding:24px;transform:translateY(14px);transition:transform .25s;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
    .overlay.open .modal{transform:translateY(0);}
    .modal h3{font-family:'Playfair Display',serif;font-size:1.15rem;margin-bottom:4px;}
    .modal-sub{font-size:0.78rem;color:var(--muted);margin-bottom:18px;}
    .fg{margin-bottom:13px;}
    label{display:block;font-size:0.73rem;font-weight:500;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
    input,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.86rem;padding:8px 11px;outline:none;transition:border-color .15s;}
    input:focus,textarea:focus{border-color:var(--accent);}
    textarea{resize:vertical;min-height:60px;}
    .type-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;}
    .tbtn{padding:8px 4px;border-radius:8px;border:2px solid var(--border);background:var(--surface2);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.7rem;font-weight:600;cursor:pointer;text-align:center;transition:all .16s;}
    .tbtn .te{display:block;font-size:1.1rem;margin-bottom:2px;}
    .tbtn.sel.school{border-color:var(--school);background:rgba(77,208,138,0.1);color:var(--school);}
    .tbtn.sel.university{border-color:var(--university);background:rgba(90,171,255,0.1);color:var(--university);}
    .tbtn.sel.company{border-color:var(--company);background:rgba(255,140,90,0.1);color:var(--company);}
    .tbtn.sel.org{border-color:var(--org);background:rgba(201,127,255,0.1);color:var(--org);}
    .mactions{display:flex;gap:8px;margin-top:18px;}
    .btn{flex:1;padding:9px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.86rem;font-weight:600;cursor:pointer;border:none;transition:all .16s;}
    .btn-p{background:var(--accent);color:#000;}
    .btn-p:hover{opacity:.88;}
    .btn-s{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
    .btn-s:hover{color:var(--text);}
    .toast{position:fixed;bottom:18px;right:18px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:9px 15px;border-radius:8px;font-size:0.8rem;z-index:99999;transform:translateY(50px);opacity:0;transition:all .25s;pointer-events:none;}
    .toast.show{transform:translateY(0);opacity:1;}
    @media(max-width:700px){.sidebar{display:none;}.legend{display:none;}}
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🎓</div>
    <h1>NZ <span>ScholarMap</span></h1>
  </div>
  <div class="legend">
    <div class="li"><div class="dot" style="background:var(--school)"></div>School</div>
    <div class="li"><div class="dot" style="background:var(--university)"></div>University</div>
    <div class="li"><div class="dot" style="background:var(--company)"></div>Company</div>
    <div class="li"><div class="dot" style="background:var(--org)"></div>Organisation</div>
  </div>
  <div class="hint">📍 Click map to add a scholarship</div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="sb-top">
      <h2>All Scholarships</h2>
      <span class="total-badge" id="totalBadge">0</span>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchBox" placeholder="🔍  Search by name, provider, amount..." oninput="renderAll()"/>
    </div>

    <div class="filters-panel">
      <div class="filters-toggle" onclick="toggleFP()">
        <div class="ftog-left">🎛️ Filters</div>
        <div class="ftog-right">
          <span class="active-pill" id="activePill">0 active</span>
          <span class="fchev open" id="fchev">▶</span>
        </div>
      </div>
      <div class="filters-body open" id="filtersBody">
        <div class="filters-inner">
          <div class="fgroup"><div class="fglabel">📂 Category</div><div class="chips" id="chips-category"></div></div>
          <div class="fgroup"><div class="fglabel">🎯 Study Level</div><div class="chips" id="chips-level"></div></div>
          <div class="fgroup"><div class="fglabel">🌏 Eligibility</div><div class="chips" id="chips-eligibility"></div></div>
          <div class="fgroup"><div class="fglabel">🪶 Ethnicity</div><div class="chips" id="chips-ethnicity"></div></div>
          <div class="fgroup"><div class="fglabel">⚥ Gender</div><div class="chips" id="chips-gender"></div></div>
          <div class="fgroup"><div class="fglabel">📚 Field of Study</div><div class="chips" id="chips-field"></div></div>
          <div class="fgroup"><div class="fglabel">💰 Funding Type</div><div class="chips" id="chips-funding"></div></div>
          <div class="fgroup"><div class="fglabel">📍 Island</div><div class="chips" id="chips-island"></div></div>
          <div class="filter-footer">
            <div class="vis-count">Showing <span id="visibleCount">0</span> scholarships</div>
            <button class="clear-btn" onclick="clearFilters()">Clear all</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sections-scroll" id="sectionsScroll"></div>
  </aside>
  <div id="map"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>📍 Add Scholarship</h3>
    <p class="modal-sub" id="msub"></p>
    <div class="fg">
      <label>Provider Type</label>
      <div class="type-grid">
        <button class="tbtn sel school" onclick="selType('school',this)"><span class="te">🏫</span>School</button>
        <button class="tbtn" onclick="selType('university',this)"><span class="te">🎓</span>University</button>
        <button class="tbtn" onclick="selType('company',this)"><span class="te">🏢</span>Company</button>
        <button class="tbtn" onclick="selType('org',this)"><span class="te">🌐</span>Organisation</button>
      </div>
    </div>
    <div class="fg"><label>Provider Name *</label><input id="fProvider" placeholder="e.g. University of Auckland, Fonterra"/></div>
    <div class="fg"><label>Scholarship Name *</label><input id="fName" placeholder="e.g. International Excellence Award"/></div>
    <div class="fg"><label>Amount / Value</label><input id="fAmount" placeholder="e.g. NZD $10,000 / year or Full Tuition"/></div>
    <div class="fg"><label>Description / Eligibility</label><textarea id="fDesc" placeholder="Who can apply? What is required?"></textarea></div>
    <div class="fg"><label>Website Link (optional)</label><input type="url" id="fUrl" placeholder="https://..."/></div>
    <div class="mactions">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" onclick="saveScholarship()">Save Scholarship</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

  {id:'b7',type:'university',tags:['intl','undergrad','postgrad','north','open','open-gender','any','partial'],provider:'Auckland University of Technology (AUT)',name:'AUT International Scholarship',amount:'Up to NZD $10,000',desc:'For international undergraduate and postgraduate students. Up to 50 scholarships awarded annually over 2 years.',url:'https://www.aut.ac.nz/study/fees-and-scholarships/scholarships-and-awards-at-aut',lat:-36.854,lng:174.766,builtin:true},

  {id:'b9',type:'university',tags:['intl','domestic','phd','north','open','open-gender','any','full'],provider:'Massey University',name:'Massey Doctoral Scholarship',amount:'Tuition + living stipend',desc:'For both domestic and international PhD students across all campuses (Auckland, Wellington, Palmerston North).',url:'https://www.massey.ac.nz/study/scholarships-and-awards/',lat:-40.356,lng:175.609,builtin:true},
  {id:'b10',type:'university',tags:['intl','domestic','phd','north','open','open-gender','any','full'],provider:'Victoria University of Wellington',name:'VUW Doctoral Scholarship',amount:'Tuition + living allowance',desc:'Fully funded doctoral scholarships for domestic and international students. Merit-based selection.',url:'https://www.wgtn.ac.nz/scholarships',lat:-41.290,lng:174.768,builtin:true},
  {id:'b11',type:'university',tags:['intl','undergrad','postgrad','south','open','open-gender','any','partial'],provider:'University of Canterbury',name:'UC International Scholarship',amount:'NZD $5,000 – $10,000',desc:'Range of scholarships for international students at undergraduate and postgraduate levels.',url:'https://www.canterbury.ac.nz/study/scholarships/',lat:-43.522,lng:172.580,builtin:true},

const SHOW_TAGS=['maori','pasifika','asian','women','stem','health','business','law','arts','education','environment','trades-field','full','undergrad','postgrad','phd','trades','intl','domestic'];

function tagH(tags,inline){
  return(tags||[]).filter(t=>SHOW_TAGS.includes(t)).map(t=>{
    const m=TM[t];if(!m)return'';
    const s=inline?`font-size:0.6rem;font-weight:600;padding:1px 5px;border-radius:7px;margin:1px;display:inline-block;background:${m.bg};color:${m.c};border:1px solid ${m.b};`:``;
    return inline?`<span style="${s}">${m.l}</span>`:`<span class="tag" style="background:${m.bg};color:${m.c};border:1px solid ${m.b};">${m.l}</span>`;
  }).join('');
}

// MAP
const map=L.map('map',{center:[-41.5,172.8],zoom:6,minZoom:5,maxBounds:[[-48,165],[-33,180]],maxBoundsViscosity:0.8});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19,crossOrigin:true}).addTo(map);
map.on('click',e=>{pendingLL=e.latlng;openModal(e.latlng);});

function makeIcon(t){const c={school:'#4dd08a',university:'#5aabff',company:'#ff8c5a',org:'#c97fff'}[t]||'#f5c842';return L.divIcon({className:'',html:`<div style="width:22px;height:22px;background:${c};border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid white;box-shadow:0 3px 8px rgba(0,0,0,0.4);"></div>`,iconSize:[22,22],iconAnchor:[11,22],popupAnchor:[0,-24]});}

function addMarker(s){
  if(markers[s.id])return;
  const m=L.marker([s.lat,s.lng],{icon:makeIcon(s.type)}).addTo(map);
  const tl={school:'🏫 School',university:'🎓 University',company:'🏢 Company',org:'🌐 Organisation'}[s.type];
  const lnk=s.url?`<a href="${s.url}" target="_blank" style="color:#f5c842;font-size:0.76rem;">Visit Website →</a>`:'';
  const ct=s.builtin?'':' <span style="font-size:0.6rem;background:rgba(245,200,66,0.2);color:#f5c842;border:1px solid rgba(245,200,66,0.4);padding:1px 5px;border-radius:7px;font-weight:700;">CUSTOM</span>';
  m.bindPopup(`<div style="font-family:sans-serif;min-width:200px;max-width:270px;">
    <div style="font-size:0.68rem;color:#7a9ab5;margin-bottom:3px;">${tl}${ct}</div>
    <strong style="font-size:0.92rem;">${s.provider}</strong><br/>
    <div style="font-size:0.8rem;color:#e8f0f8;margin:2px 0;">${s.name}</div>
    ${s.amount?`<div style="color:#f5c842;font-weight:700;margin:3px 0;">${s.amount}</div>`:''}
    ${(s.tags||[]).length?`<div style="margin:5px 0;">${tagH(s.tags,true)}</div>`:''}
    ${s.desc?`<div style="font-size:0.73rem;color:#7a9ab5;margin-top:3px;line-height:1.5;">${s.desc}</div>`:''}
    ${lnk?`<div style="margin-top:6px;">${lnk}</div>`:''}
  </div>`,{maxWidth:290});
  markers[s.id]=m;
}

function initMarkers(){allItems().forEach(addMarker);}

function toggleFP(){
  fpOpen=!fpOpen;
  document.getElementById('filtersBody').classList.toggle('open',fpOpen);
  document.getElementById('fchev').classList.toggle('open',fpOpen);
}

function buildChips(){
  let tot=0;
  Object.keys(FD).forEach(g=>{
    const c=document.getElementById('chips-'+g);if(!c)return;
    c.innerHTML='';
    FD[g].forEach(d=>{
      const on=activeFilters[g].includes(d.v);
      if(on)tot++;
      const b=document.createElement('button');
      b.className=`chip c-${d.v}`+(on?' on':'');
      b.textContent=d.label;
      b.onclick=()=>toggleF(g,d.v);
      c.appendChild(b);
    });
  });
  const p=document.getElementById('activePill');
  if(tot>0){p.textContent=tot+' active';p.classList.add('show');}else{p.classList.remove('show');}
}

function toggleF(g,v){
  const a=activeFilters[g],i=a.indexOf(v);
  if(i===-1)a.push(v);else a.splice(i,1);
  buildChips();renderAll();
}

function clearFilters(){
  Object.keys(activeFilters).forEach(k=>activeFilters[k]=[]);
  document.getElementById('searchBox').value='';
  buildChips();renderAll();
}

function passes(s){
  const q=(document.getElementById('searchBox').value||'').toLowerCase();
  if(q&&!(s.provider+s.name+(s.desc||'')+(s.amount||'')).toLowerCase().includes(q))return false;
  const {category,level,eligibility,ethnicity,gender,field,funding,island}=activeFilters;
  const t=s.tags||[];
  if(category.length&&!category.includes(s.type))return false;
  if(level.length&&!level.some(l=>t.includes(l)))return false;
  if(eligibility.length&&!eligibility.some(e=>t.includes(e)))return false;
  if(ethnicity.length&&!ethnicity.some(e=>t.includes(e)))return false;
  if(gender.length&&!gender.some(g=>t.includes(g)))return false;
  if(field.length&&!field.some(f=>t.includes(f)))return false;
  if(funding.length&&!funding.some(f=>t.includes(f)))return false;
  if(island.length&&!island.some(i=>t.includes(i)))return false;
  return true;
}

function renderAll(){
  buildChips();
  const filtered=allItems().filter(passes);
  document.getElementById('totalBadge').textContent=allItems().length;
  document.getElementById('visibleCount').textContent=filtered.length;
  allItems().forEach(s=>{
    if(!markers[s.id])return;
    const vis=filtered.some(f=>f.id===s.id);
    if(vis&&!map.hasLayer(markers[s.id]))markers[s.id].addTo(map);
    if(!vis&&map.hasLayer(markers[s.id]))map.removeLayer(markers[s.id]);
  });
  const cont=document.getElementById('sectionsScroll');cont.innerHTML='';
  SECS.forEach(sec=>{
    const items=filtered.filter(s=>s.type===sec.key);
    const wrap=document.createElement('div');
    const head=document.createElement('div');
    head.className='sec-head';
    head.innerHTML=`<div class="sec-left"><span style="font-size:.95rem;">${sec.emoji}</span><span class="sec-name" style="color:var(--${sec.key})">${sec.label}</span></div><div style="display:flex;align-items:center;gap:7px;"><span class="sec-cnt ${sec.key}">${items.length}</span><span class="sec-chev ${openSections[sec.key]?'open':''}">▶</span></div>`;
    head.onclick=()=>{openSections[sec.key]=!openSections[sec.key];renderAll();};
    const body=document.createElement('div');
    body.className='sec-body'+(openSections[sec.key]?' open':'');
    const cw=document.createElement('div');cw.className='cards-wrap';
    if(items.length===0){
      cw.innerHTML=`<div class="no-results">No ${sec.label.toLowerCase()} match your filters.</div>`;
    }else{
      items.forEach(s=>{
        const card=document.createElement('div');card.className=`card ${s.type}`;card.onclick=()=>flyTo(s.id);
        const cb=s.builtin?'':`<span class="tag" style="background:rgba(245,200,66,0.15);color:#f5c842;border:1px solid rgba(245,200,66,0.3);">CUSTOM</span>`;
        card.innerHTML=`<div class="card-top"><div class="card-name">${s.provider}</div>${!s.builtin?`<button class="card-del" onclick="delCustom(event,'${s.id}')">✕</button>`:''}</div><div class="card-schname">${s.name}</div>${s.amount?`<div class="card-amount">${s.amount}</div>`:''}<div class="tags">${tagH(s.tags,false)}${cb}</div>${s.desc?`<div class="card-desc">${s.desc}</div>`:''}${s.url?`<a class="card-link" href="${s.url}" target="_blank" onclick="event.stopPropagation()">Visit Website →</a>`:''}<div class="card-loc">📍 ${s.lat.toFixed(3)}, ${s.lng.toFixed(3)}</div>`;
        cw.appendChild(card);
      });
    }
    const ab=document.createElement('button');ab.className='add-btn';ab.innerHTML=`+ Add ${sec.label.replace(/s$/,'')}`;ab.onclick=()=>{selType_=sec.key;openModalManual();};
    cw.appendChild(ab);body.appendChild(cw);wrap.appendChild(head);wrap.appendChild(body);cont.appendChild(wrap);
  });
}

function flyTo(id){
  const s=allItems().find(x=>x.id===id);if(!s)return;
  map.flyTo([s.lat,s.lng],11,{duration:1.2});
  setTimeout(()=>{if(markers[id]){if(!map.hasLayer(markers[id]))markers[id].addTo(map);markers[id].openPopup();}},1300);
}

function delCustom(e,id){
  e.stopPropagation();if(!confirm('Remove this custom scholarship?'))return;
  custom=custom.filter(s=>s.id!==id);
  if(markers[id]){map.removeLayer(markers[id]);delete markers[id];}
  localStorage.setItem('nz_custom_v2',JSON.stringify(custom));
  renderAll();showToast('Scholarship removed.');
}

function openModal(ll){document.getElementById('msub').textContent=`Pin location: ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;resetForm();document.getElementById('overlay').classList.add('open');setTimeout(()=>document.getElementById('fProvider').focus(),200);}
function openModalManual(){if(!pendingLL)pendingLL={lat:-41.2865,lng:174.7762};document.getElementById('msub').textContent=`Pin location: ${pendingLL.lat.toFixed(5)}, ${pendingLL.lng.toFixed(5)}`;resetForm();const idx={school:0,university:1,company:2,org:3}[selType_];document.querySelectorAll('.tbtn')[idx].classList.add('sel',selType_);document.getElementById('overlay').classList.add('open');setTimeout(()=>document.getElementById('fProvider').focus(),200);}
function resetForm(){['fProvider','fName','fAmount','fDesc','fUrl'].forEach(id=>document.getElementById(id).value='');selType_='school';document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('sel','school','university','company','org'));document.querySelectorAll('.tbtn')[0].classList.add('sel','school');}
function closeModal(){document.getElementById('overlay').classList.remove('open');pendingLL=null;}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function selType(t,btn){selType_=t;document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('sel','school','university','company','org'));btn.classList.add('sel',t);}
function saveScholarship(){
  const p=document.getElementById('fProvider').value.trim(),n=document.getElementById('fName').value.trim();
  if(!p){alert('Please enter the provider name.');return;}
  if(!n){alert('Please enter the scholarship name.');return;}
  if(!pendingLL){alert('Please close this and click the map to set a location first.');return;}
  const s={id:'c'+Date.now(),type:selType_,tags:['open','open-gender','any','partial'],provider:p,name:n,amount:document.getElementById('fAmount').value.trim(),desc:document.getElementById('fDesc').value.trim(),url:document.getElementById('fUrl').value.trim(),lat:pendingLL.lat,lng:pendingLL.lng,builtin:false};
  custom.push(s);localStorage.setItem('nz_custom_v2',JSON.stringify(custom));addMarker(s);renderAll();closeModal();showToast('✅ Scholarship added!');setTimeout(()=>flyTo(s.id),200);
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

initMarkers();buildChips();renderAll();
</script>
</body>
</html>
